pstee: 1
n: 469
name: WaitSync
params:
  - name: Amount
    type: i
desc: |-
  Same as [Wait()](#63), but scales `Amount` according to the "Maximum Frame Rate" option in `Baldur.lua`, so that the
  action waits approximately the same number of seconds as [Wait()](#63) would at the default frame rate of 30 FPS.
  ```
  wait_ticks = <Maximum Frame Rate> * 15 / 30 * <Amount>
  ```
