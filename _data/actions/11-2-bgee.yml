bgee: 1
pstee: 1
n: 11
name: EquipItemEx
params:
  - name: Object
    type: s
  - name: EquipUnEquip
    type: i
desc: |-
  This action instructs the active creature to equip/unequip the specified item.

  {% capture note %}
  - Item must be in the creature's inventory for the script action to function.
  - When used to <a href="../../files/ids/bgee/xequip.htm#EQUIP"><code>EQUIP</code></a>, item's global effects (`timing_mode=2`) are applied to the creature each time the action is performed, and avatar animations are updated to reflect the new item.
  - When is used to <a href="../../files/ids/bgee/xequip.htm#UNEQUIP"><code>UNEQUIP</code></a>, it removes one instance of the item's global equipped effects (global effects with other timing modes are not removed).
  - The item itself never moves in the inventory, whether using the <a href="../../files/ids/bgee/xequip.htm#EQUIP"><code>EQUIP</code></a> or <a href="../../files/ids/bgee/xequip.htm#UNEQUIP"><code>UNEQUIP</code></a> mode, or whether or not the item was in the backpack or equipped.
  {% endcapture %} {% include info.html %}
