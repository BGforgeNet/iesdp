- desc: |-
    <b>Spell type</b>:

    - 0 ⟶ <b><a name="splv1_Header_0x1C_0">Special</a></b>
    - 1 ⟶ <b><a name="splv1_Header_0x1C_1">Wizard</a></b>
    - 2 ⟶ <b><a name="splv1_Header_0x1C_2">Priest</a></b>
    - 3 ⟶ <b><a name="splv1_Header_0x1C_3">Psionic</a></b>
    - 4 ⟶ <b><a name="splv1_Header_0x1C_4">Innate</a></b>
    - 5 ⟶ <b><a name="splv1_Header_0x1C_5">Bard song</a></b>

    {% capture note %}
    - <a href="#splv1_Header_0x1C_0">Special</a>, <a href="#splv1_Header_0x1C_3">Psionic</a>, <a href="#splv1_Header_0x1C_4">Innate</a>, and <a href="#splv1_Header_0x1C_5">Bard song</a> differ only by the string displayed when you cast them. They are all treated as Innate abilities, even by <a href="../../opcodes/bgee.htm#op145">opcode #145</a> and the <a href="../../scripting/triggers/bgeetriggers.htm#0x00A7"><code>SpellCastInnate()</code></a> trigger.
    - <a href="#splv1_Header_0x1C_0">Special</a> and <a href="#splv1_Header_0x1C_4">Innate</a> will display <code>"(Caster): (<a href="#splv1_Header_0x8">spell name</a>): (target)"</code>.
    - <a href="#splv1_Header_0x1C_3">Psionic</a> and <a href="#splv1_Header_0x1C_5">Bard song</a> will display <code>"(Caster): Casts (<a href="#splv1_Header_0x8">spell name</a>): (target)"</code> (which can be misleading).
    - <a href="#splv1_Header_0x1C_1">Wizard</a> and <a href="#splv1_Header_0x1C_2">Priest</a> will also display <code>"(Caster): Casts (<a href="#splv1_Header_0x8">spell name</a>): (target)"</code>.
    - Any spell cast by one of the <a href="../../scripting/actions/bgeeactions.htm#113"><code>ForceSpell()</code></a> script actions will instead display <a href="#splv1_Header_0x1C_0">Special</a>/<a href="#splv1_Header_0x1C_4">Innate</a> casting message.
    - Any spell cast by the "BattleSong" (Bard Song/Shaman Dance) or <a href="../../scripting/actions/bgeeactions.htm#160"><code>ApplySpell()</code></a> script actions will display <a href="#splv1_Header_0x1C_0">Special</a>/<a href="#splv1_Header_0x1C_4">Innate</a> casting message.
    - For any spell cast by another opcode, its casting message will depend on that opcode, but is usually the same as the <a href="#splv1_Header_0x1C_0">Special</a>/<a href="#splv1_Header_0x1C_4">Innate</a> casting message.
    - All other values (`6 – 65535`) functions the same as <a href="#splv1_Header_0x1C_3">Psionic</a>/<a href="#splv1_Header_0x1C_5">Bard song</a>.
    - <a href="../../files/ids/bgee/stats.htm#51"><code>SPELLFAILUREMAGE</code></a> is related to Spell type <a href="#splv1_Header_0x1C_1">Wizard</a>.
    - <a href="../../files/ids/bgee/stats.htm#52"><code>SPELLFAILUREPRIEST</code></a> is related to Spell type <a href="#splv1_Header_0x1C_2">Priest</a>.
    - <a href="../../files/ids/bgee/stats.htm#194"><code>SPELL_FAILURE_INNATE</code></a> is related to Spell type <a href="#splv1_Header_0x1C_3">Psionic</a>/<a href="#splv1_Header_0x1C_4">Innate</a>/<a href="#splv1_Header_0x1C_5">Bard song</a>.
    - Normally, any subspells that scale with <a href="#splv1_Extended_Header_0x10">Level</a> should be of the same <a href="#splv1_Header_0x1C">Type</a> as the spell casting them.
      - If they don't scale, it doesn't really matter.
      - It also doesn't matter when they are applied through <a href="../../opcodes/bgee.htm#op146">opcode #146</a><code><sup><small>*</small></sup>p2=2</code>/<a href="../../opcodes/bgee.htm#op326">opcode #326</a>/<a href="../../opcodes/bgee.htm#op333">opcode #333</a>.
    {% endcapture %} {% include info.html %}
  type: word
