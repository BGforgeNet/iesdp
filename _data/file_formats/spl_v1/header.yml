- desc: |-
    <b>Spell Level</b>

    - There is no good reason for a <a href="#splv1_Header_0x1C_0">Special</a>/<a href="#splv1_Header_0x1C_3">Psionic</a>/<a href="#splv1_Header_0x1C_4">Innate</a>/<a href="#splv1_Header_0x1C_5">Bard song</a> to be any <a href="#splv1_Header_0x34">Spell level</a> except `1`.
    - If the SPL is never <a href="../../opcodes/bgee.htm#op147">learned</a>/<a href="../../opcodes/bgee.htm#op171">gained</a> (only force-cast by script/opcode), <a href="#splv1_Header_0x34">Spell level</a> doesn't matter, but there may be some niche cases that check it (f.i. <a href="../../scripting/triggers/bgeetriggers.htm#0x4031"><code>HaveSpell()</code></a>).
